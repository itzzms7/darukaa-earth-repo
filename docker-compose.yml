services:
  db:
    image: postgis/postgis:17-3.5
    container_name: darukaa-postgis
    restart: unless-stopped
    environment:
      POSTGRES_DB: darukaa
      POSTGRES_USER: darukaa
      POSTGRES_PASSWORD: darukaa_dev_password
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data: